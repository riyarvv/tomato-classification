<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Tomato Harvester Control</title>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 { text-align: center; margin-bottom: 20px; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
        }
        .card {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 20px;
            color: #333;
        }
        .video-container {
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }
        #videoFeed { width: 100%; height: auto; }
        .safety-warning {
            background: #ff9800;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s ease;
        }
        .btn-enable { background: #4caf50; color: white; width: 100%; font-size: 1.2em; padding: 15px; }
        .btn-disable { background: #f44336; color: white; width: 100%; }
        .btn-home { background: #2196f3; color: white; }
        .btn-emergency { background: #ff0000; color: white; font-size: 1.2em; padding: 15px; margin-top: 10px; }
        .servo-slider { width: 100%; margin: 10px 0; }
        .status-item {
            background: #f5f5f5;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
        }
        .led {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .led-red { background: #f44336; box-shadow: 0 0 5px #f44336; }
        .led-green { background: #4caf50; box-shadow: 0 0 5px #4caf50; animation: pulse 1s infinite; }
        .led-yellow { background: #ffc107; box-shadow: 0 0 5px #ffc107; }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍅 SAFE Tomato Harvester Control</h1>
        
        <div class="safety-warning">
            ⚠️ SERVOS START DISABLED - Click "ENABLE SERVOS" to begin
        </div>
        
        <div class="grid">
            <div class="card">
                <h2>📷 Camera View</h2>
                <div class="video-container">
                    <img id="videoFeed" src="/video_feed">
                </div>
            </div>
            
            <div class="card">
                <h2>🎮 Control Panel</h2>
                
                <div class="status-item">
                    <span>Servo Status:</span>
                    <span id="servoStatus">DISABLED</span>
                </div>
                <div class="status-item">
                    <span>Emergency Stop:</span>
                    <span id="emergencyStatus">INACTIVE</span>
                </div>
                
                <button id="enableBtn" class="btn btn-enable" onclick="enableServos()">
                    🔌 ENABLE SERVOS
                </button>
                <button id="disableBtn" class="btn btn-disable" onclick="disableServos()" disabled>
                    ⚡ DISABLE SERVOS
                </button>
                
                <button id="homeBtn" class="btn btn-home" onclick="moveHome()" disabled>
                    🏠 MOVE TO HOME
                </button>
                
                <hr>
                
                <h3>Individual Servo Control</h3>
                <div id="servoControls">
                    <label>Base (10-100°):</label>
                    <input type="range" id="base" min="10" max="100" step="1" value="55" disabled>
                    <span id="baseVal">55°</span><br>
                    
                    <label>Shoulder (30-160°):</label>
                    <input type="range" id="shoulder" min="30" max="160" step="1" value="90" disabled>
                    <span id="shoulderVal">90°</span><br>
                    
                    <label>Elbow (20-90°):</label>
                    <input type="range" id="elbow" min="20" max="90" step="1" value="45" disabled>
                    <span id="elbowVal">45°</span><br>
                    
                    <label>Gripper (15-100°):</label>
                    <input type="range" id="gripper" min="15" max="100" step="1" value="100" disabled>
                    <span id="gripperVal">100°</span><br>
                </div>
                
                <button id="emergencyBtn" class="btn btn-emergency" onclick="emergencyStop()">
                    🚨 EMERGENCY STOP
                </button>
                <button id="resetBtn" class="btn" onclick="resetEmergency()" style="background:#666; width:100%; margin-top:5px;">
                    🔄 Reset Emergency
                </button>
            </div>
        </div>
    </div>
    
    <script>
        var servosEnabled = false;
        
        // Setup sliders
        function setupSlider(id, min, max, callback) {
            $('#' + id).on('input', function() {
                var angle = parseInt($(this).val());
                $('#' + id + 'Val').text(angle + '°');
                if (servosEnabled) {
                    $.post('/api/servo/' + id, JSON.stringify({angle: angle}), 
                        function(data) { console.log(data); })
                    .fail(function() { alert('Failed to move servo'); });
                }
            });
        }
        
        setupSlider('base', 10, 100);
        setupSlider('shoulder', 30, 160);
        setupSlider('elbow', 20, 90);
        setupSlider('gripper', 15, 100);
        
        function enableServos() {
            $.post('/api/enable', function(data) {
                servosEnabled = true;
                $('#servoStatus').text('ENABLED').css('color', '#4caf50');
                $('#enableBtn').prop('disabled', true);
                $('#disableBtn').prop('disabled', false);
                $('#homeBtn').prop('disabled', false);
                $('input[type="range"]').prop('disabled', false);
                alert('✅ Servos enabled! Move to home position first.');
            }).fail(function() {
                alert('Failed to enable servos');
            });
        }
        
        function disableServos() {
            $.post('/api/disable', function(data) {
                servosEnabled = false;
                $('#servoStatus').text('DISABLED').css('color', '#f44336');
                $('#enableBtn').prop('disabled', false);
                $('#disableBtn').prop('disabled', true);
                $('#homeBtn').prop('disabled', true);
                $('input[type="range"]').prop('disabled', true);
            });
        }
        
        function moveHome() {
            $.post('/api/home', function(data) {
                console.log(data);
            });
        }
        
        function emergencyStop() {
            if (confirm('⚠️ EMERGENCY STOP! This will disable all servos. Continue?')) {
                $.post('/api/emergency', function(data) {
                    servosEnabled = false;
                    $('#servoStatus').text('EMERGENCY STOP').css('color', '#ff0000');
                    $('#emergencyStatus').text('ACTIVE').css('color', '#ff0000');
                    $('#enableBtn').prop('disabled', true);
                    $('#disableBtn').prop('disabled', true);
                    $('#homeBtn').prop('disabled', true);
                    $('input[type="range"]').prop('disabled', true);
                });
            }
        }
        
        function resetEmergency() {
            $.post('/api/reset', function(data) {
                $('#emergencyStatus').text('INACTIVE').css('color', '#4caf50');
                $('#enableBtn').prop('disabled', false);
                alert('Emergency reset. Click "Enable Servos" to continue.');
            });
        }
        
        function refreshStatus() {
            $.get('/api/status', function(data) {
                if (data.emergency_stopped) {
                    $('#emergencyStatus').text('ACTIVE').css('color', '#ff0000');
                } else {
                    $('#emergencyStatus').text('INACTIVE').css('color', '#4caf50');
                }
                
                if (data.servos_enabled) {
                    servosEnabled = true;
                    $('#servoStatus').text('ENABLED').css('color', '#4caf50');
                    $('#enableBtn').prop('disabled', true);
                    $('#disableBtn').prop('disabled', false);
                    $('#homeBtn').prop('disabled', false);
                    $('input[type="range"]').prop('disabled', false);
                } else {
                    servosEnabled = false;
                    $('#servoStatus').text('DISABLED').css('color', '#f44336');
                    $('#enableBtn').prop('disabled', false);
                    $('#disableBtn').prop('disabled', true);
                    $('#homeBtn').prop('disabled', true);
                    $('input[type="range"]').prop('disabled', true);
                }
                
                // Update slider values
                for (var servo in data.positions) {
                    if ($('#' + servo).length) {
                        $('#' + servo).val(data.positions[servo]);
                        $('#' + servo + 'Val').text(Math.round(data.positions[servo]) + '°');
                    }
                }
            });
        }
        
        setInterval(refreshStatus, 2000);
        refreshStatus();
    </script>
</body>
</html>
